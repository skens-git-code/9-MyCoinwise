<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Subtle filter for crisp rendering -->
    <filter id="crisp-mark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#fc0100" flood-opacity="0.25" />
    </filter>
  </defs>
  <g transform="translate(4.565, 8.431) scale(0.091, 0.091)" filter="url(#crisp-mark)">
    <!-- Main Left Chevron Piece -->
    <polygon points="186,0 363,0 177,186 177,332 363,518 186,518 0,332 0,186" fill="#FC0100" />
    <!-- Top-Right Slanted Bar -->
    <polygon points="427,0 603,0 476,127 300,127" fill="#FC0100" />
    <!-- Bottom-Right Slanted Bar -->
    <polygon points="300,391 476,391 603,518 427,518" fill="#FC0100" />
  </g>
</svg>