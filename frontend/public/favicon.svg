<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mcw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="coin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Rounded Base Badge -->
  <rect width="64" height="64" rx="16" fill="url(#mcw-grad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />
  
  <!-- Trend / Growth Line -->
  <path d="M14 44 L26 32 L36 38 L50 20" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
  <polyline points="42,20 50,20 50,28" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
  
  <!-- Glowing Coin Emblem -->
  <circle cx="26" cy="32" r="4.5" fill="url(#coin-grad)" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="36" cy="38" r="4.5" fill="url(#coin-grad)" stroke="#ffffff" stroke-width="1.5" />
</svg>