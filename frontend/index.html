<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>MyCoinwise – Smart Budget Tracker</title>
    <meta name="description" content="AI-powered personal finance tracker for teens and young adults. Track expenses, set savings goals, and get intelligent spending insights." />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyCoinwise" />
    <meta name="mobile-web-app-capable" content="yes" />

    <script>
      (() => {
        try {
          document.documentElement.dataset.theme = localStorage.getItem('mcw-theme') === 'amoled' ? 'amoled' : 'light';
        } catch {
          document.documentElement.dataset.theme = 'light';
        }

        // Keep the browser chrome colour in sync with the ACTIVE theme.
        // It was a hard-coded #059669 (neither theme's surface colour) while
        // manifest.json declared #7c3aed, so the status bar / address bar
        // flashed an unrelated colour during launch in standalone mode.
        // light -> --surface-0 #f8fafc, amoled -> #000000.
        try {
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', document.documentElement.dataset.theme === 'amoled' ? '#000000' : '#f8fafc');
        } catch { /* meta tag is optional */ }

        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then((regs) => {
              for (const r of regs) r.unregister();
            });
          }
          if ('caches' in window) {
            caches.keys().then((keys) => {
              for (const k of keys) caches.delete(k);
            });
          }
        }
      })();
    </script>


    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:title" content="MyCoinwise – Smart Budget Tracker" />
    <meta property="og:description" content="AI-powered personal finance tracker with multi-language support, goal tracking, and smart alerts." />
    <meta property="og:type" content="website" />

    <!-- Google Fonts: preconnected and loaded non-blockingly for high performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
