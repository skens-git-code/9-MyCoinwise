    <title>MyCoinwise – Smart Budget Tracker</title>
    <meta name="description" content="AI-powered personal finance tracker for teens and young adults. Track expenses, set savings goals, and get intelligent spending insights." />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <script>
      (() => {
        try {
          document.documentElement.dataset.theme = localStorage.getItem('mcw-theme') === 'amoled' ? 'amoled' : 'light';
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then((regs) => {
              for (const r of regs) r.unregister();
            });
          }
          if ('caches' in window) {
            caches.keys().then((keys) => {
              for (const k of keys) caches.delete(k);
            });
          }
        }
      })();
    </script>

    <!-- Microsoft Clarity: loaded asynchronously after page load in production -->

      if (typeof window !== 'undefined' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {

            (function (c, l, a, r, i, t, y) {
              c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
              t = l.createElement(r);

              t.src = "https://www.clarity.ms/tag/" + i;

              y = l.getElementsByTagName(r)[0];
              y.parentNode.insertBefore(t, y);
            })(window, document, "clarity", "script", "y60svimjg2");
          };
          if ('requestIdleCallback' in window) {
            requestIdleCallback(initClarity, { timeout: 3000 });
          } else {
            setTimeout(initClarity, 2500);
          }
        });
      }
    </script>
