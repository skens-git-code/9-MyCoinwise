name: CI & Performance Guardrails

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Backend & Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend syntax & integrity test
        env:
          CI: true
          JWT_SECRET: ci-test-jwt-secret-key-32-chars-long!
          NODE_ENV: test
        run: |
          cd backend
          npm ci --ignore-scripts || npm install
          npm test

      - name: Frontend tests
        env:
          CI: true
        run: |
          cd frontend
          npm ci || npm install
          npm test

      - name: Frontend build & bundle size budget check
        run: |
          cd frontend
          npm run build
          npm run size

  lighthouse:
    name: Lighthouse CI Performance Audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './.lighthouserc.json'
